<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Manhattan Coffee Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="map" aria-label="Map of Manhattan coffee shops"></div>

<aside class="panel" id="panel">
  <button class="sheet-handle" id="sheetHandle" aria-label="Expand or collapse results"></button>

  <div class="searchbar">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="q" type="search" placeholder="Search shops, notes, neighborhoods" autocomplete="off" aria-label="Search coffee shops">
    <button id="clearQ" class="icon-btn" aria-label="Clear search" hidden>
      <svg class="ico" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <button id="settingsBtn" class="icon-btn" aria-label="Photo settings">
      <svg class="ico" viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 14 2.5h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.76 8.98a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42H14c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </div>

  <div class="chips" id="chips" role="tablist" aria-label="Sort and filter">
    <button class="chip on" data-sort="rank" role="tab" aria-selected="true">Top picks</button>
    <button class="chip" data-sort="chocolate" role="tab" aria-selected="false">Chocolatey</button>
    <button class="chip" data-sort="beans" role="tab" aria-selected="false">Best beans</button>
    <button class="chip" data-sort="experience" role="tab" aria-selected="false">Unique visit</button>
    <button class="chip" data-sort="mentions" role="tab" aria-selected="false">Near misses</button>
  </div>

  <div class="scroll" id="scroll">
    <section id="listView"></section>
    <section id="detailView" hidden></section>
    <section id="settingsView" hidden></section>
  </div>
</aside>

<div class="map-ctrls">
  <button class="map-btn" id="fitBtn" aria-label="Show all shops">
    <svg class="ico" viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5a2 2 0 0 0-2 2zm2 10H3v4a2 2 0 0 0 2 2h4v-2H5v-4zm14 4h-4v2h4a2 2 0 0 0 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5a2 2 0 0 0-2-2z"/></svg>
  </button>
  <div class="zoom">
    <button class="map-btn" id="zoomIn" aria-label="Zoom in"><svg class="ico" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
    <button class="map-btn" id="zoomOut" aria-label="Zoom out"><svg class="ico" viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></button>
  </div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
